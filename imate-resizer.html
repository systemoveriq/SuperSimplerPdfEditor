<!DOCTYPE html>
<html lang="en">
<head>
<!-- Open Graph / Social Media Meta Tags -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://editpdf.ink/">
<meta property="og:title" content="editpdf.ink - 100% Private, Client-Side Web Utilities">
<meta property="og:description" content="Free, browser-based PDF editing, OCR, EXIF scrubbing, image resizing, and encrypted pastebin. Zero server uploads.">
<meta property="og:image" content="https://editpdf.ink/og-image.png">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="editpdf.ink - In-Browser Privacy Tools">
<meta name="twitter:description" content="Process PDFs, scrub EXIF tags, extract OCR text, and encrypt snippets completely offline in your browser.">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Image Pixel Resizer & Format Converter | editpdf.ink</title>
  <meta name="description" content="Resize image pixel dimensions, adjust aspect ratio, and convert JPG, PNG, WEBP instantly in your browser.">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col font-sans">

  <header class="border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-800">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="/" class="font-extrabold text-xl tracking-tight">editpdf<span class="text-indigo-600">.ink</span></a>
      <span class="text-xs bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-semibold">100% Client-Side</span>
    </div>
  </header>

  <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-8">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 p-6 space-y-6">
      <h1 class="text-2xl font-bold">Image Resizer & Converter</h1>

      <div id="dropzone" class="border-2 border-dashed border-gray-300 dark:border-gray-600 hover:border-indigo-500 rounded-2xl p-8 text-center cursor-pointer bg-gray-50/50 dark:bg-gray-900/30">
        <input type="file" id="fileInput" class="hidden" accept="image/*">
        <div class="text-4xl mb-2">🖼️</div>
        <p class="font-semibold">Upload photo to resize or convert</p>
      </div>

      <div id="controls" class="hidden grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label class="text-xs font-semibold uppercase text-gray-500">Width (px)</label>
          <input type="number" id="width" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg p-2.5 text-sm mt-1">
        </div>
        <div>
          <label class="text-xs font-semibold uppercase text-gray-500">Height (px)</label>
          <input type="number" id="height" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg p-2.5 text-sm mt-1">
        </div>
        <div>
          <label class="text-xs font-semibold uppercase text-gray-500">Format</label>
          <select id="format" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg p-2.5 text-sm mt-1">
            <option value="image/jpeg">JPG</option>
            <option value="image/png">PNG</option>
            <option value="image/webp">WEBP</option>
          </select>
        </div>
        <div class="sm:col-span-3">
          <button onclick="resizeImage()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl">Resize & Download</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    let activeImg = null;

    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      if (!e.target.files.length) return;
      const img = new Image();
      img.src = URL.createObjectURL(e.target.files[0]);
      img.onload = () => {
        activeImg = img;
        document.getElementById('width').value = img.width;
        document.getElementById('height').value = img.height;
        document.getElementById('controls').classList.remove('hidden');
      };
    });

    function resizeImage() {
      if (!activeImg) return;
      const w = parseInt(document.getElementById('width').value);
      const h = parseInt(document.getElementById('height').value);
      const fmt = document.getElementById('format').value;

      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(activeImg, 0, 0, w, h);

      const ext = fmt.split('/')[1];
      const a = document.createElement('a');
      a.download = `resized-image.${ext}`;
      a.href = canvas.toDataURL(fmt, 0.9);
      a.click();
    }
  </script>
</body>
</html>
