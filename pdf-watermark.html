<!DOCTYPE html>
<html lang="en">
<head>
<!-- Open Graph / Social Media Meta Tags -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://editpdf.ink/">
<meta property="og:title" content="editpdf.ink - 100% Private, Client-Side Web Utilities">
<meta property="og:description" content="Free, browser-based PDF editing, OCR, EXIF scrubbing, image resizing, and encrypted pastebin. Zero server uploads.">
<meta property="og:image" content="https://editpdf.ink/og-image.png">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="editpdf.ink - In-Browser Privacy Tools">
<meta name="twitter:description" content="Process PDFs, scrub EXIF tags, extract OCR text, and encrypt snippets completely offline in your browser.">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Watermark to PDF Online | editpdf.ink</title>
  <meta name="description" content="Stamp text watermarks on your PDF documents locally inside your browser without uploading to a server.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col font-sans">

  <header class="border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-800">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="/" class="font-extrabold text-xl tracking-tight">editpdf<span class="text-indigo-600">.ink</span></a>
      <span class="text-xs bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-semibold">100% Client-Side</span>
    </div>
  </header>

  <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-8 space-y-6">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 p-6 space-y-4">
      <h1 class="text-2xl font-bold">PDF Watermark Tool</h1>

      <div id="dropzone" class="border-2 border-dashed border-gray-300 dark:border-gray-600 hover:border-indigo-500 rounded-2xl p-8 text-center cursor-pointer bg-gray-50/50 dark:bg-gray-900/30">
        <input type="file" id="fileInput" class="hidden" accept="application/pdf">
        <div class="text-4xl mb-2">📄</div>
        <p class="font-semibold">Upload PDF Document</p>
      </div>

      <div id="controls" class="hidden space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Watermark Text</label>
          <input type="text" id="wmText" value="CONFIDENTIAL" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg p-2.5 text-sm">
        </div>
        <button onclick="applyWatermark()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl">Apply Watermark & Save</button>
      </div>
    </div>
  </main>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    let pdfBuffer = null;

    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async (e) => {
      if (!e.target.files.length) return;
      pdfBuffer = await e.target.files[0].arrayBuffer();
      document.getElementById('controls').classList.remove('hidden');
    });

    async function applyWatermark() {
      if (!pdfBuffer) return;
      const text = document.getElementById('wmText').value;

      const pdfDoc = await PDFLib.PDFDocument.load(pdfBuffer);
      const pages = pdfDoc.getPages();

      pages.forEach(page => {
        const { width, height } = page.getSize();
        page.drawText(text, {
          x: width / 4,
          y: height / 2,
          size: 40,
          opacity: 0.25,
          rotate: PDFLib.degrees(45)
        });
      });

      const modifiedPdf = await pdfDoc.save();
      const blob = new Blob([modifiedPdf], { type: 'application/pdf' });
      const a = document.createElement('a');
      a.download = 'watermarked.pdf';
      a.href = URL.createObjectURL(blob);
      a.click();
    }
  </script>
</body>
</html>
